<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React CDN Example</title>

    <!-- 1. Load React and React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 2. Load Babel (to translate JSX into JavaScript) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Optional: Basic CSS for styling -->
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- 3. The Root Container -->
    <div id="root"></div>

    <!-- 4. Your React Code -->
    <!-- Note: type="text/babel" is required for JSX to work -->
    <script type="text/babel">
        
        // Destructure hooks from the React global object
        const { useState } = React;

        // A Child Component
        function Counter() {
            const [count, setCount] = useState(0);

            return (
                <div>
                    <h3>Current Count: {count}</h3>
                    <button onClick={() => setCount(count + 1)}>Add</button>
                    <button onClick={() => setCount(count - 1)}>Subtract</button>
                </div>
            );
        }

        // The Main Parent Component
        function App() {
            return (
                <div className="card">
                    <h1>React via CDN ⚛️</h1>
                    <p>No build tools, no npm, just HTML.</p>
                    <hr />
                    <Counter />
                </div>
            );
        }

        // Render the App into the root div
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
